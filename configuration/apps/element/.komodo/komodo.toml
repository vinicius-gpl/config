# Komodo resources of element (config). Applied by the "element" Resource Sync declared in
# .komodo/komodo.toml at the repo root. Tags: env:hetzner and app:element.
#
# One Stack for Element Call + Element Web (compose.yml next to this folder): one deploy for all
# five containers. Ansible renders the configs and the LiveKit key file the stack mounts.

[[stack]]
name = "element"
description = "Element Call (Synapse, LiveKit, lk-jwt e frontend) e Element Web no hetzner"
tags = ["env:hetzner", "app:element"]
deploy = true
[stack.config]
server = "hetzner"
git_provider = "github.com"
repo = "vinicius-gpl/config"
branch = "main"
run_directory = "configuration/apps/element"
file_paths = ["compose.yml"]
environment = """
DOMAIN=vinicius-gpl.com
"""
links = ["https://call.vinicius-gpl.com", "https://chat.vinicius-gpl.com"]
