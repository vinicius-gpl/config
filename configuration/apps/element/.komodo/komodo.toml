# Komodo resources of element (config). Applied by the "element" Resource Sync declared in
# .komodo/komodo.toml at the repo root. Tags: env:hetzner and app:element.
#
# Element Call (Synapse, LiveKit, lk-jwt-service, frontend) and Element Web on the hetzner server.
# Ready-made images (Docker Hub / ghcr), so each container is a Komodo Deployment, not a Stack.
# Ansible (steps element-call and element-web) renders every config these mount from
# /opt/element-call/config and /opt/element-web/config, plus the Caddy sites. The container names
# are the Caddy upstreams, on the proxy network.

[[deployment]]
name = "element-synapse"
description = "Synapse (homeserver Matrix) do Element Call"
tags = ["env:hetzner", "app:element"]
deploy = true
[deployment.config]
server = "hetzner"
image.type = "Image"
image.params.image = "matrixdotorg/synapse:v1.163.0"
network = "proxy"
restart = "unless-stopped"
# Generates the signing key on the first boot, then runs the image's own start script.
command = "-c 'if [ ! -f /data/signing.key ]; then python -m synapse.app.homeserver --config-path /etc/synapse/homeserver.yaml --generate-keys; fi; exec /start.py'"
volumes = """
/opt/element-call/config/homeserver.yaml:/etc/synapse/homeserver.yaml:ro
element-synapse-data:/data
"""
environment = """
SYNAPSE_CONFIG_PATH=/etc/synapse/homeserver.yaml
UID=0
GID=0
"""
# --init reaps the child processes Synapse leaves behind (they piled up as zombies).
extra_args = ["--init", "--entrypoint=/bin/sh", "--log-opt=max-size=50m", "--log-opt=max-file=2"]
links = ["https://call.vinicius-gpl.com"]

[[deployment]]
name = "element-livekit"
description = "LiveKit SFU (mídia WebRTC) do Element Call"
tags = ["env:hetzner", "app:element"]
deploy = true
[deployment.config]
server = "hetzner"
image.type = "Image"
image.params.image = "livekit/livekit-server:v1.13.10"
network = "proxy"
restart = "unless-stopped"
command = "--config /etc/livekit.yaml"
ports = """
7881:7881/tcp
50100-50200:50100-50200/udp
"""
volumes = "/opt/element-call/config/livekit.yaml:/etc/livekit.yaml:ro"
extra_args = ["--add-host=call.vinicius-gpl.com:host-gateway", "--log-opt=max-size=50m", "--log-opt=max-file=2"]
links = ["https://call.vinicius-gpl.com"]

[[deployment]]
name = "element-lk-jwt"
description = "lk-jwt-service (autorização MatrixRTC) do Element Call"
tags = ["env:hetzner", "app:element"]
deploy = true
after = ["element-synapse", "element-livekit"]
[deployment.config]
server = "hetzner"
image.type = "Image"
image.params.image = "ghcr.io/element-hq/lk-jwt-service:0.9.0"
network = "proxy"
restart = "unless-stopped"
environment = """
LIVEKIT_JWT_BIND=:8080
LIVEKIT_URL=wss://call.vinicius-gpl.com/livekit/sfu
LIVEKIT_KEY_FILE=/etc/lk-jwt/livekit.keys
LIVEKIT_FULL_ACCESS_HOMESERVERS=call.vinicius-gpl.com
LIVEKIT_CS_API_URL_OVERRIDES=call.vinicius-gpl.com=http://element-synapse:8008
"""
volumes = "/opt/element-call/config/livekit.keys:/etc/lk-jwt/livekit.keys:ro"
extra_args = ["--add-host=call.vinicius-gpl.com:host-gateway", "--log-opt=max-size=50m", "--log-opt=max-file=2"]
links = ["https://call.vinicius-gpl.com"]

[[deployment]]
name = "element-call"
description = "Frontend do Element Call (call.vinicius-gpl.com)"
tags = ["env:hetzner", "app:element"]
deploy = true
after = ["element-synapse", "element-lk-jwt"]
[deployment.config]
server = "hetzner"
image.type = "Image"
image.params.image = "ghcr.io/element-hq/element-call:v0.28.0"
network = "proxy"
restart = "unless-stopped"
volumes = "/opt/element-call/config/config.json:/app/config.json:ro"
extra_args = ["--log-opt=max-size=50m", "--log-opt=max-file=2"]
links = ["https://call.vinicius-gpl.com"]

[[deployment]]
name = "element-web"
description = "Element Web (chat.vinicius-gpl.com)"
tags = ["env:hetzner", "app:element"]
deploy = true
after = ["element-synapse"]
[deployment.config]
server = "hetzner"
image.type = "Image"
image.params.image = "vectorim/element-web:v1.12.32"
network = "proxy"
restart = "unless-stopped"
volumes = "/opt/element-web/config/config.json:/app/config.json:ro"
extra_args = ["--log-opt=max-size=50m", "--log-opt=max-file=2"]
links = ["https://chat.vinicius-gpl.com", "https://element.vinicius-gpl.com"]
