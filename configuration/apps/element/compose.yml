# Element (Matrix): Element Call (Synapse, LiveKit, lk-jwt-service, frontend) and Element Web,
# as a single Komodo Stack on the oracle server (.komodo/komodo.toml next to this file).
#
# Ansible (steps element-call and element-web) renders every config this stack mounts from
# /opt/element-call/config and /opt/element-web/config, including the LiveKit key file, and
# publishes the Caddy sites. Container names are the Caddy upstreams.
#
# DOMAIN comes from the Stack environment (Komodo writes it to .env).
name: element

networks:
  proxy:
    external: true

volumes:
  synapse-data:
    name: element-synapse-data
    external: true

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "2"

services:
  element-synapse:
    image: matrixdotorg/synapse:v1.163.0
    container_name: element-synapse
    restart: unless-stopped
    environment:
      - SYNAPSE_CONFIG_PATH=/etc/synapse/homeserver.yaml
      - UID=0
      - GID=0
    # Generates the signing key on the first boot, then runs the image's own start script.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/signing.key ]; then
          python -m synapse.app.homeserver --config-path /etc/synapse/homeserver.yaml --generate-keys
        fi
        exec /start.py
    volumes:
      - /opt/element-call/config/homeserver.yaml:/etc/synapse/homeserver.yaml:ro,z
      - synapse-data:/data:z
    networks:
      - proxy
    logging: *logging

  element-livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: element-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7881:7881/tcp"
      - "50100-50200:50100-50200/udp"
    volumes:
      - /opt/element-call/config/livekit.yaml:/etc/livekit.yaml:ro,z
    extra_hosts:
      - "call.${DOMAIN:?}:host-gateway"
    networks:
      - proxy
    logging: *logging

  element-lk-jwt:
    image: ghcr.io/element-hq/lk-jwt-service:0.9.0
    container_name: element-lk-jwt
    restart: unless-stopped
    environment:
      - LIVEKIT_JWT_BIND=:8080
      - LIVEKIT_URL=wss://call.${DOMAIN:?}/livekit/sfu
      - LIVEKIT_KEY_FILE=/etc/lk-jwt/livekit.keys
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=call.${DOMAIN:?}
      - LIVEKIT_CS_API_URL_OVERRIDES=call.${DOMAIN:?}=http://element-synapse:8008
    volumes:
      - /opt/element-call/config/livekit.keys:/etc/lk-jwt/livekit.keys:ro,z
    extra_hosts:
      - "call.${DOMAIN:?}:host-gateway"
    depends_on:
      - element-synapse
      - element-livekit
    networks:
      - proxy
    logging: *logging

  element-call:
    image: ghcr.io/element-hq/element-call:v0.28.0
    container_name: element-call
    restart: unless-stopped
    volumes:
      - /opt/element-call/config/config.json:/app/config.json:ro,z
    depends_on:
      - element-synapse
      - element-lk-jwt
    networks:
      - proxy
    logging: *logging

  element-web:
    image: vectorim/element-web:v1.12.32
    container_name: element-web
    restart: unless-stopped
    volumes:
      - /opt/element-web/config/config.json:/app/config.json:ro,z
    depends_on:
      - element-synapse
    networks:
      - proxy
    logging: *logging
