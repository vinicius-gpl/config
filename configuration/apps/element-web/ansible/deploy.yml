---
# =========================================================================
# === ELEMENT WEB (CHAT & MESSAGING CLIENT) ===
# =========================================================================

- name: "[element-web] Criar diretórios de deploy do Element Web"
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ element_web_path | default('/opt/element-web') }}"
    - "{{ element_web_path | default('/opt/element-web') }}/config"
  tags: [element-web, element_web]

- name: "[element-web] Renderizar config.json do Element Web"
  template:
    src: "{{ apps_dir }}/element-web/config/config.json.j2"
    dest: "{{ element_web_path | default('/opt/element-web') }}/config/config.json"
    mode: '0644'
  tags: [element-web, element_web]

- name: "[element-web] Garantir que diretório conf.d do Caddy existe"
  file:
    path: "{{ caddy_path }}/conf.d"
    state: directory
    mode: '0755'
  failed_when: false
  tags: [element-web, element_web]

- name: "[element-web] Implantar configuração element-web.caddy"
  template:
    src: "{{ apps_dir }}/element-web/config/element-web.caddy.j2"
    dest: "{{ caddy_path }}/conf.d/element-web.caddy"
    mode: '0644'
  failed_when: false
  tags: [element-web, element_web]

# The container is part of the Komodo Stack "element" (apps/element); Ansible only renders the config it mounts.
- name: "[element-web] Reiniciar o container para ler a config nova (se o Komodo já subiu)"
  command: docker restart element-web
  register: element_web_restart
  failed_when:
    - element_web_restart.rc != 0
    - '"No such container" not in element_web_restart.stderr'
  when: not ansible_check_mode
  tags: [element-web, element_web]

- name: "[element-web] Recarregar Caddy para aplicar chat.{{ element_domain }}"
  command: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
  failed_when: false
  tags: [element-web, element_web]
