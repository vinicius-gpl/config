# Komodo resources owned by config: the infrastructure of each server and nothing about the apps.
#
#   Sync        "config" applies this file; one more Sync per app (netbird, element)
#               applies configuration/apps/<app>/.komodo/komodo.toml.
#   Swarm       one single-node Swarm per server (oracle, hetzner); they never join each other.
#   Builder     one per server. EVERY APP BUILDS ON THE SERVER IT RUNS ON: oracle builds the oracle
#               apps, hetzner builds the hetzner apps. NO REGISTRY: no GHCR, no push, no pull.
#               Images stay local (<app>:<commit>) and stacks deploy them with --resolve-image never.
#   Apps        config's own apps (NetBird, Element and Postgres Deployments) live in each app's
#               .komodo/komodo.toml. Ansible renders the configs and secrets they mount
#               from /opt/<app>; Komodo runs the containers.
#
# Each app repo owns its .komodo/komodo.toml (Repo, Build, Stack, Procedure, Action, Sync) and
# points to the names below: swarm "<server>", builder "<server>", network "edge".
# Tags: env:<server> and app:<name> on every resource.

[[resource_sync]]
name = "config"
description = "Aplica o .komodo/komodo.toml do config (infra dos servidores)"
tags = ["app:config"]
[resource_sync.config]
git_provider = "github.com"
repo = "vinicius-gpl/config"
branch = "main"
resource_path = [".komodo/komodo.toml"]
delete = false

# ── One Resource Sync per config app (each app keeps its own .komodo/komodo.toml) ─────

[[resource_sync]]
name = "netbird"
description = "Aplica os recursos do NetBird (servidor e painel) na Oracle"
tags = ["env:oracle", "app:netbird"]
[resource_sync.config]
git_provider = "github.com"
repo = "vinicius-gpl/config"
branch = "main"
resource_path = ["configuration/apps/netbird/.komodo/komodo.toml"]
delete = false



[[resource_sync]]
name = "element"
description = "Aplica os Deployments do Element (Call + Web) no hetzner"
tags = ["env:hetzner", "app:element"]
[resource_sync.config]
git_provider = "github.com"
repo = "vinicius-gpl/config"
branch = "main"
resource_path = ["configuration/apps/element/.komodo/komodo.toml"]
delete = false

[[resource_sync]]
name = "postgres"
description = "Aplica o Deployment do Postgres dos apps no hetzner"
tags = ["env:hetzner", "app:postgres"]
[resource_sync.config]
git_provider = "github.com"
repo = "vinicius-gpl/config"
branch = "main"
resource_path = ["configuration/apps/postgres/.komodo/komodo.toml"]
delete = false

# ── Swarms ──────────────────────────────────────────────────────────────────────────────────

[[swarm]]
name = "oracle"
description = "Swarm de um nó na Oracle"
tags = ["env:oracle", "app:swarm"]
[swarm.config]
servers = ["oracle"]

[[swarm]]
name = "hetzner"
description = "Swarm de um nó no hetzner"
tags = ["env:hetzner", "app:swarm"]
[swarm.config]
servers = ["hetzner"]

# ── Builders: each server builds its own images, no registry ────────────────────────────────

[[builder]]
name = "oracle"
description = "Constrói as imagens dos apps da Oracle na própria Oracle (sem registry)"
tags = ["env:oracle", "app:builder"]
[builder.config]
type = "Server"
params.servers = ["oracle"]

[[builder]]
name = "hetzner"
description = "Constrói as imagens dos apps do hetzner no próprio hetzner (sem registry)"
tags = ["env:hetzner", "app:builder"]
[builder.config]
type = "Server"
params.servers = ["hetzner"]
